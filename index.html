<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeira pág. HTML</title>
    <link rel="stylesheet" href="./style/exemplo.css">
</head>
<body>
    <!--A tag header serve para estruturar  cabeçalho da página-->
    <header>
        <!--h1 serve para um título-->
        <h1>Uma Vez </h1>
        <nav> <a href="./style/exemplo.css">Flamengo</a></nav>
    </header>
<main>

    <section>
        <!--section é uma TAG de estruturação-->
        <div>
            <h3>Flamengo</h3>
            <ul>
                <li>Sempre Flamengo</li>
                <li>Flamengo sempre eu es de ser</li>
                <li>O meu maior prazer</li>
                <li>Velo brilhar</li>
            </ul>
        </div>
    
        <div>
            <h3>SEJA NA TERRA, SEJA NO MAR</h3>
            <ol>
                <li>Vencer</li>
                <li>Vencer, vencer</li>
                <li>Uma vez Flamengo</li>
                <li>FLAMENGO ATÉ MORRER!!!</li>
            </ol>
        </div>
    </section>
</body>
</html>
