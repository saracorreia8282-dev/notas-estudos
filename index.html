<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeira pág. HTML</title>
    <link rel="stylesheet" href="./style/exemplo.css">
</head>
<body>
    <!--A tag header serve para estruturar  cabeçalho da página-->
    <header>
        <!--h1 serve para um título-->
        <h1>Minha página de lista para PET</h1>
        <nav> <a href="./style/exemplo.css">Flamengo</a></nav>
    </header>
<main>

    <section>
        <!--section é uma TAG de estruturação-->
        <div>
            <h3>Lista não ordenada de compras para PET</h3>
            <ul>
                <li>Rapete para Nessecidades</li>
                <li>Ração</li>
                <li>Roleira</li>
                <li>Rotes (Ração e Água)</li>
            </ul>
        </div>
    
        <div>
            <h3>Lista ordenada de compras para PET</h3>
            <ol>
                <li>Potes (Água e Ração)</li>
                <li>Coleira</li>
                <li>Ração</li>
                <li>Rapete para Nessecidades</li>
            </ol>
        </div>
    </section>
</body>
</html>
